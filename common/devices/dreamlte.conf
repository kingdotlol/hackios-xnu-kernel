# Device profile: sourced by common/build.sh and common/run.sh.
# Samsung Galaxy S8 (dreamlte) with Exynos 8895

NAME="Samsung Galaxy S8 (dreamlte)"
KIND=phone
SOC="Samsung Exynos 8895"

# --- boot chain (phones) ---
# The phone boots a Mu-Silicium UEFI with `fastboot boot`; the UEFI starts our loader.
UEFI_TARGET=dreamlte
UEFI_FD=
DTB=
# Memory map addresses from Exynos 8895 UEFI port (to be determined from device tree)
FD_BASE=0x80000000
FD_SIZE=0x04000000
PAYLOAD_BASE=0xF0000000

# --- kernel and loader ---
# xnuloader/loader.c picks its struct platform by framebuffer base
FB_BASE=0xE1000000
WIFI_ATH11K=0

# --- boot arguments ---
BOOTARGS="touchscreen=1 cpus=8"
DEFAULT_SECS=900
USERLAND_VARS=""

# --- firmware ---
# Vendor firmware from the phone's Android (never in repository)
FIRMWARE=""